appId: app.pi.minimal-desktop
productName: Pi Studio
directories:
  output: dist
files:
  - out/**
  # Vite already bundles these renderer libraries. Omit only duplicate JS/maps,
  # not notices, fonts, native dependencies or generated renderer assets.
  - '!node_modules/lucide-react/**/*.{js,mjs,map}'
  - '!node_modules/react-dom/{cjs,umd}/**/*.{js,map}'
  - '!node_modules/@shikijs/*/dist/**/*.{js,mjs,map}'
  - package.json
  - LICENSE
  - src/renderer/src/fonts/OFL.txt
  - resources/pi-deepseek-tui-LICENSE
  - resources/desktop-session-guard.mjs
  - resources/desktop-rpc.mjs
  - resources/desktop-subagents.mjs
  - resources/desktop-subagent-status.mjs
  - resources/codex-compaction/**
  - resources/terminal/**
  - packages/shared/codex-model.ts
asarUnpack:
  - node_modules/node-pty/**
  - resources/desktop-session-guard.mjs
  - resources/desktop-rpc.mjs
  - resources/desktop-subagents.mjs
  - resources/desktop-subagent-status.mjs
  - resources/codex-compaction/**
  - resources/terminal/**
  - packages/shared/codex-model.ts
asar: true
npmRebuild: false
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  artifactName: 'Pi-Studio-${version}-mac-${arch}.${ext}'
  notarize: false
